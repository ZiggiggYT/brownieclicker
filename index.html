<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brownie Baker</title>
  <meta name="description" content="A cozy pixel-art bakery idle game. Bake brownies, fix up Grandma's old bakery, and keep your customers happy.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1d120d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1.1.0">
</head>

<body>
  <div id="stage">

    <!-- ===================== the bakery ===================== -->
    <div id="game" hidden>
      <header id="topbar">
        <div class="title">BROWNIE BAKER</div>
        <div class="clock"><canvas id="sunmoon" width="54" height="54"></canvas><span id="clock">DAY 1 8:00 AM</span></div>
        <div class="coins" id="coinBox"><span class="ico" data-sprite="coin" data-scale="3"></span><span id="coins">0</span></div>
        <div id="stars" title="Reputation"></div>
        <div class="top-buttons">
          <button class="btn small" id="soundBtn" data-sound-label>SOUND OFF</button>
          <button class="btn small" id="menuBtn">MENU</button>
        </div>
      </header>

      <div id="sceneWrap" class="px-frame">
        <canvas id="scene" width="876" height="552"></canvas>
        <div id="rushBar" hidden><span>BROWNIE RUSH! EVERYTHING BAKES x3</span><div class="bar"><i></i></div></div>
        <div id="banners"></div>
        <div id="dayCard" class="px-panel" hidden>
          <div class="big" id="dayTitle">DAY 1 DONE!</div>
          <p id="dayText">You sold 0 brownies and earned $0</p>
          <p class="sub" id="dayCount">Next day in 8...</p>
          <button class="btn" id="startNow">START NOW</button>
        </div>
      </div>

      <section id="bottom">
        <div class="card px-panel" id="goalCard">
          <div class="card-head">GOAL</div>
          <div class="card-body">
            <p id="goalText">Bake 25 brownies</p>
            <div class="bar" id="goalBar"><i></i></div>
            <p class="reward" id="goalReward">REWARD <span class="ico" data-sprite="coin" data-scale="2"></span> 15</p>
          </div>
        </div>
        <div class="card px-panel" id="orderCard">
          <div class="card-head">SPECIAL ORDER</div>
          <div class="card-body order">
            <span id="orderWho" class="who"></span>
            <div class="order-info">
              <p id="orderText">No orders yet...</p>
              <div class="bar time" id="orderBar"><i></i></div>
            </div>
            <button class="btn" id="giveBtn" disabled>GIVE</button>
          </div>
        </div>
      </section>

      <aside id="shop" class="px-panel">
        <nav id="tabs">
          <button class="tab active" data-tab="helpers">HELPERS</button>
          <button class="tab" data-tab="recipes">RECIPES</button>
          <button class="tab" data-tab="fixes">FIX UP</button>
        </nav>
        <div id="rows"></div>
      </aside>
    </div>

    <!-- ===================== story intro ===================== -->
    <div id="intro" hidden>
      <div class="intro-buttons">
        <button class="btn small" data-sound-label id="introSound">SOUND OFF</button>
        <button class="btn small" id="skipBtn">SKIP</button>
      </div>
      <canvas id="introCanvas" width="640" height="300"></canvas>
      <div id="dialog" class="px-panel">
        <div id="speaker"></div>
        <p id="line"></p>
        <span id="more"></span>
      </div>
      <div id="titleScreen">
        <h1>BROWNIE<br>BAKER</h1>
        <canvas id="titleBrownie" width="160" height="144"></canvas>
        <p class="blink">CLICK OR PRESS SPACE</p>
      </div>
    </div>

    <!-- ===================== popups (never pause the game) ===================== -->
    <div id="modal" hidden>
      <div class="modal-box px-panel">
        <div class="big" id="modalTitle"></div>
        <p id="modalBody"></p>
        <div id="modalButtons"></div>
      </div>
    </div>

    <div id="loading">LOADING...</div>
  </div>

  <script src="js/version.js?v=1.1.0"></script>
  <script src="js/atlas.js?v=1.1.0"></script>
  <script src="js/data.js?v=1.1.0"></script>
  <script src="js/sim.js?v=1.1.0"></script>
  <script src="js/audio.js?v=1.1.0"></script>
  <script src="js/render.js?v=1.1.0"></script>
  <script src="js/ui.js?v=1.1.0"></script>
  <script src="js/intro.js?v=1.1.0"></script>
  <script src="js/main.js?v=1.1.0"></script>
</body>

</html>
